  <text x="1388" y="301" fill="#D9FFF4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">DEPLOY</text>
  <text x="1269" y="409" fill="#D9FFF4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">SIS</text>
  <text x="895" y="389" fill="#D9FFF4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">DEEP</text>
  <text x="816" y="259" fill="#D9FFF4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">CLAW</text>
