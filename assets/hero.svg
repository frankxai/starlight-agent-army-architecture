  <text x="112" y="310" fill="#B8F7E0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="0">Architecture</text>
  <text x="114" y="366" fill="#D8E8E3" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" letter-spacing="0">Control-plane workflows, swarm roles, memory provenance, and deployment patterns</text>
  <text x="910" y="131" fill="#D9FFF4" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">HERMES</text>
