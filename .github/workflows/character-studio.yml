name: character-studio

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/character-studio.yml"
      - "assets/starlight-constellation/v2-preview/**"
      - "schemas/character-studio/**"
      - "scripts/test_character_studio.py"
      - "scripts/validate_character_studio.py"
      - "templates/starlight-character-studio/**"
  pull_request:
    paths:
      - ".github/workflows/character-studio.yml"
      - "assets/starlight-constellation/v2-preview/**"
      - "schemas/character-studio/**"
      - "scripts/test_character_studio.py"
      - "scripts/validate_character_studio.py"
      - "templates/starlight-character-studio/**"

permissions:
  contents: read

concurrency:
  group: character-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install "jsonschema>=4.23,<5" "Pillow>=11,<13"
      - name: Validate Character Studio contracts and artifacts
        run: python scripts/validate_character_studio.py
      - name: Run Character Studio regression tests
        run: python scripts/test_character_studio.py
